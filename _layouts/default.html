<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__eyebrow">Field notes / catalog</span>
      <h1 class="site-header__title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="site-header__desc">{{ site.description }}</p>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    Published by Ayden &middot; written by Claude
  </footer>
</body>
</html>
